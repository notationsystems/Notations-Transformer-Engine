# The core invariant registry -- bound to THIS repository's actual
# state (inspected 2026-08-25), never to an aspirational one. Every
# `status: enforced` entry names executable enforcement that exists;
# every gap is stated, not defaulted.
# The core version is DECLARED in architecture/core.yaml and is not
# restated here -- one referent, one place. It versions core schema and
# invariant semantics only, and moves only under bend_protocol.
core_declaration: architecture/core.yaml
# ---------------------------------------------------------------------
# The substrate control loop -- ACQUISITION-FIRST. A loop, not a stack:
# the control graph binds to these transitions (edges), each with real
# input/output types and an error surface, not to the boxes.
# ---------------------------------------------------------------------
control_loop:
  edges:
    - from: acquisition
      to: evidence
      via: [adapters/*.py -> scout/pipeline.py (documents/records),
            execution/dispatcher.py -> materials/results.py (computed results)]
      error_surface: AdmissionError (refusal, nothing written)
      note: class assigned here, immutably (evidence/classes.py)
    - from: evidence
      to: observation
      via: [evidence.admission.admit_observation -> EvidencePool.put_observation]
      error_surface: AdmissionError
    - from: observation
      to: trust
      via: [retrieval/engine.py (DeterministicRetrievalEngine), materials/value.py]
      error_surface: typed refusals in the retrieval/value layers
    - from: trust
      to: canonical_state
      via: [core/canonical (defeasible state; content-addressed VersionId)]
      error_surface: core.canonical.validation
    - from: canonical_state
      to: retrieval_execution
      via: [materials/iteration.reevaluate_program -> experiment session ->
            execution.dispatcher.SpecificationDispatcher]
      error_surface: refusal semantics (unrunnable/halted/rejected)
    - from: retrieval_execution
      to: validation
      via: [execution verification (ProofBackend, VerifiedExecution),
            experiment/step semantic gate]
      error_surface: VerificationFailure / REJECTED occurrences
    - from: validation
      to: derived_state
      via: [evidence.types.DerivedValue + DerivedGrounding, materials model state]
      error_surface: AdmissionError (grounding must resolve)
    - from: derived_state
      to: acquisition
      rule: THE RETURN EDGE -- derived state re-enters ONLY through
            acquisition and admission; no direct write into evidence or
            canonical state exists
      status: enforced
      enforcement:
        locks: tests/test_architecture_sync.py   # minting/write seam ratchet
        failure_mode: fail_closed

invariants:
  # -- epistemic boundary (see architecture/evidence_class.yaml for the
  #    six evidence-classing invariants; registered there, counted here)
  - id: evidence_classing_set
    see: architecture/evidence_class.yaml
    status: registered

  - id: core_schema_closed
    rule: verticals cannot widen core evidence schemas; extension happens
          in vertical modules (structures/, materials/) against the open
          content mapping, never by adding fields to core types
    status: enforced
    enforcement:
      validator: frozen dataclasses + content-addressed identities
                 (a widened type is a different identity) + the vertical
                 conformance gate (architecture/conformance.py)
      failure_mode: fail_closed

  - id: metric_before_optimization
    rule: optimization requires declared decision criteria; no metric,
          no optimization target
    status: enforced
    enforcement:
      validator: materials.iteration.reevaluate_program requires explicit
                 criteria (make_criterion) before any candidate ranking
      locks: existing materials test suite
      failure_mode: fail_closed

  - id: provenance_total
    rule: every observation names its records, every derived value its
          grounding; admission refuses references that do not resolve
    status: enforced
    enforcement:
      validator: evidence.admission (referential checks on admit_*)
      locks: existing evidence admission test suite
      failure_mode: fail_closed

  - id: evidence_append_only
    rule: nothing is ever deleted; ids are content-addressed
    status: enforced
    limitation: TOMBSTONE SEMANTICS ARE ABSENT -- payload retirement with
                retained identity/provenance edges, and defeasance
                propagation to downstream canonical claims, are NOT
                implemented in this pool. Recorded by the generality
                probe (revocable_record); implementing it is a core
                change requiring a version increment, not a quiet patch.
    enforcement:
      validator: EvidencePool exposes no delete/mutate primitive
      failure_mode: structural
    awaiting_decision: true
    decision: >-
      whether to take the bend now or when a revocation-compelling source
      arrives. DEFERRED, deliberately: no such source exists, and building
      tombstones for no consumer is a proposal wearing measurement's
      clothes -- the same discipline that stopped the checker
      optimization at -6%.
    trigger: >-
      the deferral EXPIRES when EvidencePool grows a persistence
      primitive. Today legacy records are 0 because nothing is stored, so
      the bend is free; the moment records outlive a process it becomes
      structural and every stored record predates the semantics. The
      decision must therefore be made BEFORE persistence lands, which is
      the only window where it stays cheap -- so the trigger is a check
      that goes red at that event rather than a note that survives it.
    trigger_enforced_by: tests/test_tombstone_decision_trigger.py

  # -- agent/process boundary (these bind the DEVELOPMENT process, not
  #    repository runtime; the runtime contains no hosted model bindings
  #    and no multi-agent doctrine files -- see model_binding.yaml)
  #
  #    ALL SCOPED this_repository, and the reason is not bookkeeping. A
  #    development-process rule has no single project-wide status: each
  #    repository has its own authorship lineage, its own doctrine and
  #    its own review history, so two bound parties holding DIFFERENT
  #    statuses here are both telling the truth. The derived register
  #    counted four such rows as contested when it joined on the id
  #    alone, which read as four disagreements about the core and was
  #    four facts about two repositories. Declaring the scope is what
  #    makes the register's remaining contests mean something.
  - id: no_vendor_in_doctrine
    scope: this_repository
    rule: vendor identities never appear in doctrine; they belong in
          model_binding.yaml and in adapters
    status: enforced
    enforcement:
      validator: architecture.conformance.lint_doctrine_vendor_free,
                 called by architecture.doctrine_generator on every
                 generated file, so unlinted doctrine cannot be produced
      locks: tests/test_architecture_sync.py
      failure_mode: fail_closed
    note: >-
      CORRECTED 2026-08-26 by the derived register. This row carried the
      process status with the note "no doctrine files exist in this
      repository". Five generated doctrine files and a mechanical vendor
      lint have existed here since the architecture-sync phase, and the
      diff gate makes a hand-edited projection fail -- so the row was
      stale about THIS repository, not about a sibling. Worth recording
      plainly: the register was built to catch a claim about someone
      else's state going stale, and the first thing it caught in this
      file was a claim about our own. A note is not re-checked when the
      thing it describes changes, and nothing here was watching it.
  - id: cross_vendor_validation
    scope: this_repository
    awaiting_decision: true
    decision: whether single-binding authorship is acceptable, or review
              must cross vendors
    status: process_unresolved
    note: see model_binding.yaml builder_check_lineage -- single-binding
          authorship is the current fact; cross-vendor review is a
          flagged, undecided process decision
  - id: no_self_validation
    scope: this_repository
    status: process
    note: artifact lineage inside the runtime IS checked (stage-5
          registry gate, host recomputation); check-AUTHORSHIP lineage
          is the model_binding.yaml record
  - id: agent_concurrence_is_not_corroboration
    scope: this_repository
    status: process
    note: runtime analog enforced -- multiple proof backends over one
          computation are independent WARRANTS of one statement, never
          independent evidence (campaign metadata stays out of evidence
          identity; locked by stage 7/8 tests)
  - id: snapshot_drift_detected
    status: superseded
    superseded_by: model_binding.yaml snapshot_verification (split into
                   pin_accepted / behavioral_canary / attested_identity)

  # -- doctrine generation (doctrine is a projection, never a source) --
  - id: doctrine_source_is_canonical
    rule: doctrine derives only from the canonical YAML sources
    status: enforced
    enforcement: {validator: architecture.doctrine_generator,
                  locks: tests/test_architecture_sync.py,
                  failure_mode: fail_closed}
  - id: doctrine_regeneration_is_deterministic
    rule: generation is a pure function of the canonical file contents
    status: enforced
    enforcement: {locks: tests/test_architecture_sync.py, failure_mode: fail_closed}
  - id: generated_doctrine_matches_source
    rule: regenerating and diffing against the committed projection is
          the gate; a non-zero diff fails closed (this also makes manual
          edits to generated doctrine fail)
    status: enforced
    enforcement: {validator: architecture.conformance.check_doctrine_current,
                  locks: tests/test_architecture_sync.py,
                  failure_mode: fail_closed}
    note: no CI workflow infrastructure exists in this repository; the
          test suite is the gate and any future CI calls the same check
  - id: doctrine_budget_enforced
    rule: generated doctrine is capped; overflow fails closed and directs
          structural material into schemas/enforcement
    status: enforced
    enforcement: {validator: architecture.doctrine_generator.DOCTRINE_BUDGET_CHARS,
                  failure_mode: fail_closed}
  - id: no_reproducible_agent_execution_mitigated
    rule: every hosted agent execution retains the complete audit record
          (binding, snapshot identity where available, adapter version,
          doctrine hash, effective prompt, input/output fingerprints,
          timestamp, lineage); auditability != re-executability, and the
          distinction is stated
    status: boundary_implemented
    enforcement: {validator: architecture.retention.AgentExecutionRecord,
                  locks: tests/test_architecture_sync.py,
                  failure_mode: fail_closed}
    note: no live agent-execution path exists in this repository; the
          record is the mandatory boundary such a path must construct
  - id: quarantine_not_discard
    rule: rejected ingest candidates are retained with failing invariant
          ids, queryable and repairable; repair re-enters through normal
          ingest; rejection rate per invariant per run is a metric;
          there is NO force path
    status: enforced
    enforcement: {validator: evidence.quarantine.Quarantine,
                  locks: tests/test_architecture_sync.py,
                  failure_mode: fail_closed}

  # -- DECISIONS, NOT MEASUREMENTS ------------------------------------
  #
  # A PROPERTY OF THIS PROJECT, recorded because it explains why these
  # entries have outlived twenty phases of rigour rather than being an
  # observation about four stragglers: EVERY INSTRUMENT HERE CONVERTS AN
  # ASSUMPTION INTO A MEASUREMENT, AND NONE CONVERTS A MEASUREMENT INTO
  # A CHOICE. Probes, mutation batteries, reachability traces, currency
  # gates and the derived register all answer "what is true"; not one of
  # them can answer "what should we do about it". These rows will not
  # resolve by being measured harder -- they are waiting on a person,
  # which is a reasonable place to wait so long as the register keeps
  # saying so instead of letting them fade.
  #
  # `awaiting_decision: true` is what makes the register say so: it is
  # derived and re-emitted on every run, so an item cannot survive by
  # inertia the way a prose note can.
  - id: multi_writer_write_conflict
    scope: this_repository
    rule: a merge policy for concurrent canonical assertions
    status: awaiting_decision
    awaiting_decision: true
    decision: >-
      which policy governs two writers asserting into one canonical
      state. Unblocked by the identity-policy work -- the merge GUARD
      exists and refuses a policy mismatch rather than guessing -- so
      what is missing is the choice, not the mechanism.
    enforcement:
      validator: none; refusal on mismatch is the current behaviour
      failure_mode: fail_closed

  - id: self_optimization_acceptance_criteria
    scope: this_repository
    rule: capabilities 5-9 (measures its own performance, identifies
          deficiencies, optimizes its architecture) require falsifiable
          acceptance criteria before any of them may be claimed
    status: partially_enforced
    awaiting_decision: true
    decision: >-
      SETTLED for capability 6, open for 7-9. The original wording has no
      SUBJECT: every deficiency this project has found was surfaced by an
      agent operating on the system, not by the system, and crediting
      those to the substrate is the same category error as citing a
      reconstruction as a declaration. So the criterion is a PROVENANCE
      requirement, not a threshold -- a finding counts only if a
      committed check surfaced it without an agent reading the code.
      Capability 5 is evidenced by the gated optimizations. 7-9 stay
      unclaimed: nothing here optimizes its own architecture.
    enforcement:
      validator: metric_before_optimization (no metric, no optimization
                 target) plus the provenance bar above
      locks: tests/test_architecture_sync.py
      failure_mode: fail_closed
    note: >-
      the partition is honest in the direction that costs this
      repository. The two most interesting findings of the phase that set
      this criterion -- a vacuous pass, and invariants enforced but never
      stated -- both fall on the NO side, because a human read output and
      grepped source to find them. A criterion that kept the impressive
      findings and excluded the dull ones would be a criterion fitted to
      the answer.

  - id: builder_check_lineage_recorded
    scope: this_repository
    awaiting_decision: true
    decision: whether enforcement-code review must be cross-vendor
    rule: every enforcement validator records its authoring binding; a
          validator authored by a binding sharing a vendor with the
          proposing lineage it constrains requires an explicit review
          record
    status: recorded_unresolved
    enforcement:
      record: architecture/model_binding.yaml (authorship recorded)
      unresolved: whether review must be cross-vendor (process decision,
                  flagged, not defaulted)
