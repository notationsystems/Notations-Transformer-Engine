"rules":
  - "a mirror is not a source: provenance is established across all parties before anything is read, and byte-identity is what makes content unable to establish it"
  - "an emitted projection is never a canonical source, whoever emitted it"
  - "a party's own name is read only from an artifact it provably authored; a jointly agreed artifact says what was agreed, not what either party is called"
  - "no repository may report a status for an invariant it does not own without citing the owning repository's source"
  - "an invariant claimed enforced must name a test that cites its id"
  - "the derivation fails if any bound repository is unreachable"
  - "currency is directional: the deriving party is authoritative for itself and exempt by construction; every sibling is checked against its remote and a sibling missing published state fails"
  - "currency is reported per sibling and never collapsed -- a derivation is only as current as its worst sibling, and which sibling that is is part of the answer"
  - "a claim scoped to this_repository is a statement about its own repository's state; two such claims differing is a fact, not a contest. scope defaults to project, so silence never buys the exemption"
  - "a repository reporting an invariant another party owns names that party and never transcribes its status; the owner's live status is resolved on every derivation, and a deferral that does not resolve fails"
  - "the repository labels in this register are local handles for the join, not the parties' names"
