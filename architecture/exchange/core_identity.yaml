"surface_is_declared_not_globbed": "a glob would silently widen the core the first time a file was added beside these, and widening the core without a bend is what bend_protocol forbids. Adding a path to the surface is therefore itself a core change, and shows up as a moved digest"
"what_each_one_is_for":
  "digest": "the IDENTITY -- which core that statement was made about"
  "version": "the COMPATIBILITY statement -- what a party may rely on"
"what_this_does_not_claim": "that a matching digest means two parties agree about anything beyond these bytes. It is an identity, not a warrant: it says which core, and says nothing about whether that core is right"
"why_a_digest_as_well_as_a_version": "the version moves ONLY under bend_protocol, so many different core commits legitimately carry one label and a party pinning core@1.0.0 cannot tell which of them it bound. The acquisition channel's census OBSERVED this -- two checkouts of this repository, different commits, three days apart, both reporting 1.0.0, ancestry undeterminable from there. It could not act on it: naming which core a label refers to is this repository's act, because this repository declares the label"
