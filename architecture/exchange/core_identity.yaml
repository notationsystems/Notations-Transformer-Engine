"how_a_party_checks_it": "architecture/core_identity.py::verify(expected_digest, root) over its own copy of the core. A mismatch returns the per-file digests, so the answer is WHICH FILE moved rather than a bare no -- a difference with no address leaves the reader where the label left them"
