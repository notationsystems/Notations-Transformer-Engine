"deliberately_outside":
  "architecture/core.yaml": "it declares the version this digest annotates. Hashing it would make the digest depend on the digest's own publication"
  "architecture/exchange/": "derived artifacts. A projection is not a source, and a fixed point cannot be reached by an artifact that feeds itself"
  "architecture/invariants.yaml": "invariant ROWS are added without bending; a registry that moved the core digest would move it on almost every commit"
  "structures/, materials/, evidence/, scout/, execution/": "verticals and layers EXTEND the core; they never define it. A vertical that changed the core digest would mean the core had been widened to admit it, which is the thing bend_protocol forbids by name"
